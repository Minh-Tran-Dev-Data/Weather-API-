<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="search">
          <input type="text" name="" id="we" placeholder="Search City" />
          <button class="search-btn" id="btn">
            <span class="material-symbols-outlined"> search </span>
          </button>
        </div>
      </div>
      <div class="container-info" style="display: none;">
          <div class="section" >
        <div class="location">
          <span class="material-symbols-outlined"> location_on </span>
          <h4 class="country">Ho Chi Minh City</h4>
        </div>
        <h5 class="date">Wed , 08 July , 2026</h5>
      </div>
      <div class="weather" >
        <img src="../IMG/1.png" alt="" />
        <div class="weather-info">
          <h3 class="temp">29°C</h3>
          <h4 class="condition">Sunny</h4>
        </div>
      </div>
      <div class="weather-condition">
        <div class="humidity">
          <span class="material-symbols-outlined">water_drop</span>
          <div class="condition-item">
            <h3 class="humidity-info">Humidity</h3>
            <h4 class="humidity-value">55%</h4>
          </div>
        </div>

        <div class="wind">
          <span class="material-symbols-outlined">air</span>
          <div class="condition-item">
            <h3 class="wind-info">Wind Speed</h3>
            <h4 class="wind-value">2 m/s</h4>
          </div>
        </div>
        
      </div>
      <div class="forecast-container">
        <div class="forecast-info">
          <h4>09,July</h4>
          <img src="../IMG/2.png" alt="">
          <h5>29°C</h5>
        </div>
        <div class="forecast-info">
          <h4>09,July</h4>
          <img src="../IMG/2.png" alt="">
          <h5>29°C</h5>
        </div>
        <div class="forecast-info">
          <h4>09,July</h4>
          <img src="../IMG/2.png" alt="">
          <h5>29°C</h5>
        </div>
        <div class="forecast-info">
          <h4>09,July</h4>
          <img src="../IMG/2.png" alt="">
          <h5>29°C</h5>
        </div>

      </div>
      </div>
      <div class="message-weather">
        <img src="../IMG/4304c24a-c10b-46c1-a5fb-97ca91c81d04.png" alt="">
        <h3>Search City</h3>
        <h5>Find out the weather conditions of the city</h5>
      </div>
      <div class="not-found" style="display: none;">
        <img src="../IMG/images.png" alt="">
        <h3>Search City</h3>
        <h5>Find out the weather conditions of the city</h5>
      </div>
    </div>
  </body>
  <script src="../JS/index.js"></script>
</html>
